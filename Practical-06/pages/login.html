<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentHub - Login</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<header>
        <nav class="navbar" aria-label="Main navigation">
            <a href="index.html" class="logo-link">
                <img src="../images/logo.png" alt="StudentHub Logo" class="logo-image">
                <span class="logo-text">StudentHub</span>
            </a>

            <button id="menuButton" class="hamburger" type="button" aria-expanded="false" aria-label="Open navigation menu">
                ☰
            </button>

            <ul id="navigationMenu" class="navigation-menu">
                <li><a href="index.html" >Home</a></li>
                <li><a href="about.html" >About</a></li>
                <li><a href="events.html" >Events</a></li>
                <li><a href="faq.html" >FAQ</a></li>
                <li><a href="contact.html" >Contact</a></li>
                <li><a href="login.html" aria-current="page">Login</a></li>
                <li><a href="register.html" >Register</a></li>
                <li>
                    <button id="themeButton" class="theme-button" type="button">
                        🌙 Dark Mode
                    </button>
                </li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="content-section">
            <h1>Student Login</h1>
            <form action="#" method="post">
                <div>
                    <label for="loginEmail">Email Address</label>
                    <input type="email" id="loginEmail" autocomplete="email" required>
                </div>
                <div>
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" autocomplete="current-password" required>
                </div>
                <div>
                    <label><input type="checkbox" id="remember"> Remember me</label>
                </div>
                <button type="submit">Login</button>
            </form>
            <p class="login-link">Don't have an account? <a href="register.html">Register here</a></p>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 StudentHub. All rights reserved.</p>
    </footer>

    <script src="../js/script.js"></script>
</body>
</html>
