<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        StudentHub - Events
    </title>

    <link
        rel="stylesheet"
        href="../CSS/style.css"
    >

</head>


<body>


    <!-- ================================
         HEADER
         ================================ -->

    <header>

        <nav
            class="navbar"
            aria-label="Main navigation"
        >

            <!-- LOGO -->

            <a
                href="index.html"
                class="logo-link"
            >

                <img
                    src="../images/logo.png"
                    alt="StudentHub Logo"
                    class="logo-image"
                >

                <span class="logo-text">
                    StudentHub
                </span>

            </a>


            <!-- HAMBURGER -->

            <button
                id="menuButton"
                class="hamburger"
                type="button"
                aria-expanded="false"
                aria-label="Open navigation menu"
            >

                ☰

            </button>


            <!-- NAVIGATION -->

            <ul
                id="navigationMenu"
                class="navigation-menu"
            >

                <li>

                    <a href="index.html">
                        Home
                    </a>

                </li>


                <li>

                    <a href="about.html">
                        About
                    </a>

                </li>


                <li>

                    <a
                        href="events.html"
                        aria-current="page"
                    >
                        Events
                    </a>

                </li>


                <li>

                    <a href="faq.html">
                        FAQ
                    </a>

                </li>


                <li>

                    <a href="contact.html">
                        Contact
                    </a>

                </li>


                <li>

                    <a href="login.html">
                        Login
                    </a>

                </li>


                <li>

                    <a href="register.html">
                        Register
                    </a>

                </li>


                <li>

                    <button
                        id="themeButton"
                        class="theme-button"
                        type="button"
                    >

                        🌙 Dark Mode

                    </button>

                </li>

            </ul>

        </nav>

    </header>


    <!-- ================================
         MAIN CONTENT
         ================================ -->

    <main>


        <section class="page-heading">

            <h1>
                College Events
            </h1>

            <p>
                Explore upcoming college events,
                workshops and activities.
            </p>

        </section>


        <!-- ================================
             SEARCH AND FILTER
             ================================ -->

        <section class="content-section">

            <h2>
                Search and Filter Events
            </h2>


            <div class="event-controls">


                <!-- SEARCH -->

                <div class="event-control">

                    <label for="eventSearch">
                        Search Events
                    </label>

                    <input
                        type="search"
                        id="eventSearch"
                        placeholder="Search by event name..."
                    >

                </div>


                <!-- CATEGORY FILTER -->

                <div class="event-control">

                    <label for="categoryFilter">
                        Category
                    </label>

                    <select id="categoryFilter">

                        <option value="all">
                            All Categories
                        </option>

                        <option value="Workshop">
                            Workshop
                        </option>

                        <option value="Cultural">
                            Cultural
                        </option>

                        <option value="Sports">
                            Sports
                        </option>

                        <option value="Seminar">
                            Seminar
                        </option>

                        <option value="Competition">
                            Competition
                        </option>

                        <option value="Technical">
                            Technical
                        </option>

                    </select>

                </div>


                <!-- SORT -->

                <div class="event-control">

                    <label for="sortEvents">
                        Sort By
                    </label>

                    <select id="sortEvents">

                        <option value="dateAsc">
                            Date: Earliest First
                        </option>

                        <option value="dateDesc">
                            Date: Latest First
                        </option>

                        <option value="titleAsc">
                            Title: A-Z
                        </option>

                        <option value="titleDesc">
                            Title: Z-A
                        </option>

                    </select>

                </div>

            </div>

        </section>


        <!-- ================================
             LOADING MESSAGE
             ================================ -->

        <div
            id="eventsLoading"
            class="events-message"
        >

            Loading events...

        </div>


        <!-- ================================
             ERROR MESSAGE
             ================================ -->

        <div
            id="eventsError"
            class="events-message error-message-box"
        >

        </div>


        <!-- ================================
             EVENTS
             ================================ -->

        <section
            id="eventsContainer"
            class="event-grid"
            aria-live="polite"
        >

        </section>


        <!-- ================================
             NO RESULTS
             ================================ -->

        <div
            id="noEvents"
            class="events-message"
        >

            No events found.

        </div>


        <!-- ================================
             PAGINATION
             ================================ -->

        <section
            id="pagination"
            class="pagination"
        >

        </section>

    </main>


    <!-- ================================
         FOOTER
         ================================ -->

    <footer>

        <p>

            &copy; 2026 StudentHub.
            All rights reserved.

        </p>

    </footer>


    <script src="../js/script.js"></script>
    <script src="../js/events.js"></script>
</body>

</html>
